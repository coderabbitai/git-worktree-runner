name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify ShellCheck is available
        run: shellcheck --version

      - name: Run ShellCheck
        run: |
          shellcheck bin/gtr bin/git-gtr lib/*.sh lib/commands/*.sh adapters/editor/*.sh adapters/ai/*.sh

  completions:
    name: Completions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify completion files are up to date
        run: ./scripts/generate-completions.sh --check

  bash-compatibility:
    name: macOS Bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Exercise CLI startup and shell integration with system Bash
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          export PATH="$PWD/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          export XDG_CACHE_HOME="$RUNNER_TEMP/gtr-cache"
          # Exercise the CLI with private config, not the runner image's
          # system config under its shared writable application directories.
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gtr-global.gitconfig"
          : > "$GIT_CONFIG_GLOBAL"
          /bin/bash --version
          git gtr --version
          ./bin/gtr --version
          git gtr init bash > "$RUNNER_TEMP/gtr-init.bash"
          /bin/bash -n "$RUNNER_TEMP/gtr-init.bash"
          source "$RUNNER_TEMP/gtr-init.bash"

      - name: Install BATS and Fish for integration tests
        run: brew install bats-core fish

      - name: Run full test suite with system Bash
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          # Keep BATS and CLI shebangs on Bash 3.2, even when Homebrew has Bash.
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gtr-global.gitconfig"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/gtr-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/gtr-cache"
          export XDG_DATA_HOME="$RUNNER_TEMP/gtr-data"
          : > "$GIT_CONFIG_GLOBAL"
          bats tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install BATS and shells for integration tests
        run: sudo apt-get update && sudo apt-get install -y bats fish zsh

      - name: Run tests
        run: |
          # Tests write global settings and XDG state; isolate them from the
          # runner image. Permission regressions supply their own unsafe files.
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gtr-global.gitconfig"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/gtr-config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/gtr-cache"
          export XDG_DATA_HOME="$RUNNER_TEMP/gtr-data"
          : > "$GIT_CONFIG_GLOBAL"
          bats tests/
